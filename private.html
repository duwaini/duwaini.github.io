<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duwaini | مساحة خاصة</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#F3F6F4;--surface:#FFFFFF;--ink:#13231F;--muted:#5B6B66;--line:#DCE4E0;--accent:#0F6B5A;--accent-ink:#FFFFFF;--sun:#E2A631;--bad:#B3261E;--soft:#E5EFEB;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;--body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1714;--surface:#14211D;--ink:#E6EEEA;--muted:#93A6A0;--line:#24352F;--accent:#3FB79C;--accent-ink:#06110E;--sun:#F2B544;--bad:#F2B8B5;--soft:#1A2B26;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--body);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
.back{color:var(--muted);text-decoration:none;font-size:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;margin-top:24px}
h1{font:700 28px/1.3 var(--display);margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px}
label{display:block;font-weight:600;margin-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:16px var(--body);padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{font:600 16px var(--body);padding:11px 22px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1.4em}
.list{display:grid;gap:12px;margin-top:8px}
.item{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;background:var(--bg)}
.item:hover{border-color:var(--accent)}
.item b{display:block;font-size:17px}
.item span{color:var(--muted);font-size:14px}
.item code{font:12.5px var(--mono);color:var(--muted);direction:ltr;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ghost{background:transparent;color:var(--muted);border-color:var(--line);padding:8px 14px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">→ الرجوع للموقع</a>

  <div class="box" id="gate">
    <h1>مساحة خاصة</h1>
    <p>القسم ده محمي. اكتب الباسورد عشان تفتحه.</p>
    <form id="form" autocomplete="off">
      <label for="pw">الباسورد</label>
      <div class="row">
        <input id="pw" type="password" required autofocus>
        <button id="go" type="submit">افتح</button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>

  <div class="box" id="content" hidden>
    <div class="top">
      <h1>مساحتي</h1>
      <button class="ghost" id="lockBtn" type="button">اقفل</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
/* المحتوى الخاص متشفّر في ملف private-data.json بالباسورد.
   من غير الباسورد الصحيح مفيش حد يقدر يقرأه حتى لو فتح الكود. */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function unlock(password) {
  const res = await fetch("private-data.json", { cache: "no-store" });
  if (!res.ok) throw new Error("missing");
  const box = await res.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(items) {
  document.getElementById("list").innerHTML = items.map(i => `
    <a class="item" href="${esc(i.url)}" target="_blank" rel="noopener">
      <div><b>${esc(i.title)}</b><span>${esc(i.desc || "")}</span></div>
      <code>${esc(i.url)}</code>
    </a>`).join("") || "<p>مفيش حاجة هنا لسه.</p>";
  document.getElementById("gate").hidden = true;
  document.getElementById("content").hidden = false;
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    show(await unlock(document.getElementById("pw").value));
  } catch (x) {
    err.textContent = x.message === "missing"
      ? "ملف private-data.json مش موجود جنب الصفحة. ارفعه على الريبو."
      : "الباسورد غلط. جرّب تاني.";
  } finally { btn.disabled = false; }
});

document.getElementById("lockBtn").addEventListener("click", () => {
  document.getElementById("list").innerHTML = "";
  document.getElementById("pw").value = "";
  document.getElementById("content").hidden = true;
  document.getElementById("gate").hidden = false;
});
</script>
</body>
</html>
