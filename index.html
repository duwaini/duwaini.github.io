<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duwaini | دويني</title>
<meta name="description" content="دويني: تطبيقات أندرويد ومواقع ويب صغيرة تحل مشاكل حقيقية.">
<link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
<meta property="og:image" content="assets/logo-original.jpg">
<meta name="theme-color" content="#0B0A08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: brand plate — the hero repeats the logo's lockup (mark, wordmark, diamond rule, tagline), then gold-hairline cards on black. Single dark theme by choice, matching the logo. */
:root{
  --bg:#0B0A08; --surface:#13110D; --raise:#1A1712; --ink:#EFE7D6; --muted:#A1978A; --line:#2B261D;
  --gold:#C9A063; --gold-hi:#EFD9A3; --gold-lo:#8A673A; --gold-ink:#17120A;
  --latin:"Cinzel","Times New Roman",serif;
  --ar-display:"Amiri","Times New Roman",serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 var(--body);font-weight:400}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:4px}
.gold-text{background:linear-gradient(120deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.brand img{width:40px;height:40px}
.brand b{font:600 17px/1 var(--latin);letter-spacing:.22em}
nav{display:flex;gap:4px;align-items:center}
nav a{text-decoration:none;padding:6px 12px;color:var(--muted);font-weight:500;border-radius:6px}
nav a:hover{color:var(--gold-hi)}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.lang:hover{border-color:var(--gold)}
@media (max-width:620px){nav a.hide-sm{display:none}.brand b{display:none}}

/* hero: the logo lockup */
.hero{text-align:center;padding-block:72px 56px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-20% 0 auto;height:520px;background:radial-gradient(closest-side,rgba(201,160,99,.16),transparent);pointer-events:none}
.mark{width:clamp(120px,22vw,170px);height:auto;position:relative;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6));animation:rise .9s ease-out both}
.word{font:500 clamp(40px,9vw,92px)/1 var(--latin);letter-spacing:.14em;margin:18px 0 0;position:relative;animation:rise .9s .1s ease-out both}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:22px auto 14px;max-width:560px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(270deg,transparent,var(--gold))}
.rule i{width:9px;height:9px;border:1.5px solid var(--gold);transform:rotate(45deg);flex:none}
.tagline{font:500 14px var(--latin);letter-spacing:.42em;color:var(--gold);margin:0;padding-inline-start:.42em}
.lead{color:var(--muted);font-size:18px;max-width:52ch;margin:28px auto 30px;font-weight:300}
.cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}

.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;border-radius:6px;padding:11px 22px;border:1px solid var(--line);background:transparent;color:var(--ink);transition:border-color .2s,color .2s,background .2s}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.primary{background:linear-gradient(120deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:var(--gold-ink);border-color:transparent;font-weight:600}
.btn.primary:hover{color:var(--gold-ink);filter:brightness(1.07)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}

/* sections */
section{padding-block:64px;border-top:1px solid var(--line)}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.kicker{font:500 12px var(--latin);letter-spacing:.32em;color:var(--gold);display:block;margin-bottom:6px}
h2{font:700 34px/1.3 var(--ar-display);margin:0;text-wrap:balance}
[lang="en"] h2{font:500 30px/1.3 var(--latin);letter-spacing:.06em}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 16px;font:500 14px var(--body);cursor:pointer}
.chip-btn:hover{color:var(--ink)}
.chip-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:linear-gradient(180deg,var(--raise),var(--surface));border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .25s}
.card:hover{border-color:rgba(201,160,99,.55)}
.card-top{display:flex;gap:14px;align-items:center}
.ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none;border:1px solid rgba(201,160,99,.45);background:radial-gradient(circle at 30% 25%,rgba(239,217,163,.14),transparent 70%),var(--bg);color:var(--gold)}
.ic svg{width:28px;height:28px}
.card h3{margin:0;font:700 24px/1.2 var(--ar-display)}
[lang="en"] .card h3{font:600 19px/1.3 var(--latin);letter-spacing:.04em}
.card .alt{font:500 12px var(--latin);letter-spacing:.18em;color:var(--muted)}
[lang="en"] .card .alt{font:500 13px var(--body);letter-spacing:0}
.card p{margin:0;color:var(--muted);font-weight:300}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:500 12px var(--body);padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.status{font:500 12px var(--body);padding:2px 10px;border-radius:999px;color:var(--gold);border:1px solid rgba(201,160,99,.5)}
.status.live{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{padding:8px 14px;font-size:14px}
.repo{font:400 12px var(--mono);color:var(--muted);direction:ltr;text-align:end;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}

/* about */
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:start}
.about p{color:var(--muted);max-width:60ch;margin:14px 0 0;font-weight:300}
.facts{display:grid;gap:0;margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts li{display:flex;gap:16px;align-items:baseline;padding:16px 20px;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0}
.facts b{font:500 30px/1 var(--latin);min-width:1.6ch;font-variant-numeric:tabular-nums}

footer{border-top:1px solid var(--line);padding-block:30px;color:var(--muted);font-size:14px}
.foot{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot .sig{display:flex;align-items:center;gap:10px;font:500 13px var(--latin);letter-spacing:.2em}
.foot img{width:26px;height:26px}
.lock{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--muted)}
.lock:hover{color:var(--gold-hi)}
.lock svg{width:15px;height:15px}

@media (max-width:820px){.about{grid-template-columns:1fr}.hero{padding-block:48px 40px}}
@media (max-width:400px){.grid{grid-template-columns:1fr}}

/* ===== motion ===== */
.progress{position:fixed;top:0;inset-inline:0;height:2px;z-index:30;transform-origin:right;transform:scaleX(0);background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi),var(--gold-lo))}
[dir="ltr"] .progress{transform-origin:left}
header{transition:padding .3s,background .3s}
header.small .bar{padding-block:6px}
header .bar{transition:padding .3s}
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero{min-height:min(92vh,820px);display:grid;align-items:center}
.hero .wrap{position:relative;z-index:1}

/* logo draws itself */
.mark{overflow:visible}
.mark .d-out{fill:transparent;stroke:var(--gold);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .2s cubic-bezier(.6,0,.2,1) forwards,fillin .8s 1.5s forwards}
.mark .serif{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:grow .6s 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.mark .w-part{transform:translateY(-26px);opacity:0;animation:drop .7s cubic-bezier(.2,.9,.25,1.2) forwards}
.mark .w-part:nth-of-type(1){animation-delay:1.55s}.mark .w-part:nth-of-type(2){animation-delay:1.65s}
.mark .w-part:nth-of-type(3){animation-delay:1.75s}.mark .w-part:nth-of-type(4){animation-delay:1.85s}
.mark .w-part:nth-of-type(5),.mark .w-part:nth-of-type(6){animation-delay:1.95s}
.mark-wrap{display:inline-block;animation:float 6s 3s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill:url(#mg)}}
@keyframes grow{to{transform:none}}
@keyframes drop{to{transform:none;opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* wordmark: letters rise in, then a glint runs across */
.word{display:flex;justify-content:center;gap:0;direction:ltr}
.word span{display:inline-block;background:linear-gradient(120deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(40px) rotateX(70deg);filter:blur(8px);
  animation:letter .9s calc(2s + var(--i) * .09s) cubic-bezier(.2,.8,.2,1) forwards,glint 6s calc(3.6s + var(--i) * .12s) ease-in-out infinite}
@keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes glint{0%,82%,100%{filter:brightness(1)}88%{filter:brightness(1.7) drop-shadow(0 0 10px rgba(239,217,163,.55))}}
.rule::before,.rule::after{transform:scaleX(0);animation:grow .9s 2.7s cubic-bezier(.6,0,.2,1) forwards}
.rule::before{transform-origin:right}.rule::after{transform-origin:left}
.rule i{opacity:0;animation:spin .8s 2.6s forwards}
@keyframes spin{from{opacity:0;transform:rotate(-135deg) scale(.2)}to{opacity:1;transform:rotate(45deg)}}
.tagline{opacity:0;letter-spacing:1.2em;animation:track 1.2s 3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes track{to{opacity:1;letter-spacing:.42em}}
.hero .lead,.hero .cta{opacity:0;transform:translateY(16px);animation:drop .8s 3.3s forwards}
.hero .cta{animation-delay:3.45s}
.scroll-hint{display:block;margin:38px auto 0;width:22px;height:36px;border:1.5px solid var(--line);border-radius:12px;position:relative;opacity:0;animation:drop .6s 3.8s forwards}
.scroll-hint::after{content:"";position:absolute;top:7px;left:50%;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:var(--gold);animation:wheel 1.8s 4s infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}

/* primary button sheen */
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 3.5s 4.2s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.magnet{transition:transform .25s cubic-bezier(.2,.8,.2,1)}

/* scroll reveal (only when JS runs) */
.js .reveal{opacity:0;transform:translateY(44px) scale(.98);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.js .reveal.in{opacity:1;transform:none}

/* cards: 3D tilt + light that follows the cursor */
.grid{perspective:1200px}
.card{position:relative;transform-style:preserve-3d;transition:border-color .25s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(239,217,163,.13),transparent 60%)}
.card:hover::before{opacity:1}
.card:hover{box-shadow:0 30px 60px -30px rgba(201,160,99,.35)}
.card .card-top,.card .actions{transform:translateZ(24px)}
.card:hover .ic{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,160,99,.35)}50%{box-shadow:0 0 0 8px rgba(201,160,99,0)}}

/* living icons */
.ic .lines path{stroke-dasharray:10;stroke-dashoffset:10;animation:write 3.2s ease-in-out infinite}
@keyframes write{0%{stroke-dashoffset:10}40%,75%{stroke-dashoffset:0}100%{stroke-dashoffset:-10}}
.ic .petals{transform-origin:16px 16px;animation:bloom 9s linear infinite}
@keyframes bloom{to{transform:rotate(360deg)}}
.ic .ring{animation:ringspin 14s linear infinite;transform-origin:16px 16px}
@keyframes ringspin{to{transform:rotate(-360deg)}}

.facts b{display:inline-block}
@media (prefers-reduced-motion:reduce){
  .mark .d-out{stroke-dashoffset:0;fill:url(#mg)}.mark .serif,.mark .w-part,.word span,.rule i,.tagline,.hero .lead,.hero .cta,.scroll-hint{opacity:1;transform:none;filter:none;letter-spacing:.42em}
  .rule::before,.rule::after{transform:none}.js .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<header id="hdr">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Duwaini"><img src="assets/logo-mark.svg" alt=""><b class="gold-text">DUWAINI</b></a>
    <nav>
      <a href="#projects" data-i18n="navProjects">المشاريع</a>
      <a href="#about" class="hide-sm" data-i18n="navAbout">عن الموقع</a>
      <button class="lang" id="langBtn" type="button">EN</button>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <canvas id="dust" aria-hidden="true"></canvas>
    <div class="wrap">
      <span class="mark-wrap"><svg class="mark" viewBox="0 0 200 200" width="170" height="170" role="img" aria-label="Duwaini">
        <defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1DCA6"/><stop offset=".45" stop-color="#C9A063"/><stop offset="1" stop-color="#8A673A"/></linearGradient></defs>
        <path class="d-out" pathLength="1" fill-rule="evenodd" d="M62 32H98C150 32 178 63 178 100C178 137 150 168 98 168H62ZM78 42H96C137 42 161 68 161 100C161 132 137 158 96 158H78Z"/>
        <rect class="serif" x="52" y="30" width="36" height="5" fill="url(#mg)"/>
        <rect class="serif" x="52" y="165" width="36" height="5" fill="url(#mg)"/>
        <g fill="url(#mg)" stroke="#0B0A08" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
          <polygon class="w-part" points="70,66 82,66 107,150 97,150"/>
          <polygon class="w-part" points="101,150 107,150 129,86 124,86"/>
          <polygon class="w-part" points="120,86 130,86 154,150 144,150"/>
          <polygon class="w-part" points="148,150 154,150 178,66 173,66"/>
          <rect class="w-part" x="62" y="62" width="28" height="4"/>
          <rect class="w-part" x="166" y="62" width="20" height="4"/>
        </g>
      </svg></span>
      <h1 class="word" aria-label="DUWAINI"><span style="--i:0" aria-hidden="true">D</span><span style="--i:1" aria-hidden="true">U</span><span style="--i:2" aria-hidden="true">W</span><span style="--i:3" aria-hidden="true">A</span><span style="--i:4" aria-hidden="true">I</span><span style="--i:5" aria-hidden="true">N</span><span style="--i:6" aria-hidden="true">I</span></h1>
      <div class="rule" aria-hidden="true"><i></i></div>
      <p class="tagline">TIME IS PERSONAL</p>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="cta">
        <a class="btn primary magnet" href="#projects" data-i18n="ctaProjects">شوف المشاريع</a>
        <a class="btn" href="https://github.com/duwaini" target="_blank" rel="noopener">GitHub</a>
      </div>
      <a class="scroll-hint" href="#projects" aria-label="Scroll"></a>
    </div>
  </div>

  <section id="projects">
    <div class="wrap">
      <div class="head reveal">
        <div><span class="kicker">PROJECTS</span><h2 data-i18n="projectsTitle">المشاريع</h2></div>
        <div class="filters" role="group" aria-label="filter">
          <button class="chip-btn" type="button" data-filter="all" aria-pressed="true" data-i18n="fAll">الكل</button>
          <button class="chip-btn" type="button" data-filter="web" aria-pressed="false" data-i18n="fWeb">مواقع ويب</button>
          <button class="chip-btn" type="button" data-filter="android" aria-pressed="false" data-i18n="fAndroid">أندرويد</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap about">
      <div class="reveal">
        <span class="kicker">ABOUT</span><h2 data-i18n="aboutTitle">عن الموقع</h2>
      </div>
      <ul class="facts reveal" id="facts" style="--d:.15s"></ul>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span class="sig"><img src="assets/logo-mark.svg" alt=""><span>© <span id="year"></span> DUWAINI</span></span>
    <a class="lock" href="private.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span data-i18n="private">مساحة خاصة</span>
    </a>
  </div>
</footer>

<script>
/* ============================================================
   عدّل مشاريعك من هنا بس
   url  = رابط تجربة الموقع (سيبه "" لو مش جاهز)
   apk  = رابط تحميل الـ APK من Releases (سيبه "" لو مش جاهز)
   live = true لو المشروع منشور ومتاح للناس
   ============================================================ */
const PROJECTS = [
  {
    id: "waraqa", tile: "t-waraqa",
    name: { ar: "ورقة", en: "Waraqa" },
    desc: {
      ar: "حوّل الصور لـ PDF، وحوّل الصور والملفات بين الصيغ، وعدّل ملفات الـ PDF من المتصفح.",
      en: "Turn images into PDFs, convert images and documents between formats, and edit PDFs in the browser."
    },
    platforms: ["web"], live: false,
    repo: "tennen202015-eng/Waraqa", url: "", apk: ""
  },
  {
    id: "zahra", tile: "t-zahra",
    name: { ar: "زهرة", en: "Zahra" },
    desc: {
      ar: "تتبّع الدورة الشهرية والحمل، بوضعين لكل واحد شاشته الرئيسية. من غير كاميرا ولا صور، والصلاحية الوحيدة هي الإشعارات.",
      en: "Cycle and pregnancy tracking with two modes, each with its own home screen. No camera, no photos; notifications are the only permission."
    },
    platforms: ["web", "android"], live: false,
    repo: "tennen202015-eng/Zahra", url: "", apk: ""
  },
  {
    id: "umrah", tile: "t-umrah",
    name: { ar: "رفيق العمرة", en: "Umrah Companion" },
    desc: {
      ar: "بيعدّ أشواط الطواف والسعي تلقائيًا بالـ GPS، وبيشتغل حتى مع النت الضعيف في الحرم. عربي وإنجليزي.",
      en: "Counts tawaf and sa'i rounds automatically with GPS, and keeps working on weak connections in the Haram. Arabic and English."
    },
    platforms: ["web", "android"], live: false,
    repo: "tennen202015-eng/Umrah", url: "", apk: ""
  }
];

const ICONS = {
  waraqa: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 3h11l6 6v20H8z"/><path d="M19 3v6h6"/><g class="lines"><path d="M12 16h9" stroke-linecap="round"/><path d="M12 21h9" stroke-linecap="round" style="animation-delay:.3s"/><path d="M12 26h5" stroke-linecap="round" style="animation-delay:.6s"/></g></svg>',
  zahra: '<svg viewBox="0 0 32 32" fill="currentColor"><g class="petals"><circle cx="16" cy="9" r="5"/><circle cx="23" cy="14" r="5"/><circle cx="20" cy="22" r="5"/><circle cx="12" cy="22" r="5"/><circle cx="9" cy="14" r="5"/></g><circle cx="16" cy="16" r="3.4" fill="#0B0A08"/></svg>',
  umrah: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><circle class="ring" cx="16" cy="16" r="12" stroke-dasharray="3 3"/><rect x="12" y="12" width="8" height="8" fill="currentColor" stroke="none" rx="1"/><circle cx="16" cy="4" r="2.2" fill="currentColor" stroke="none"><animateTransform attributeName="transform" type="rotate" from="0 16 16" to="-360 16 16" dur="4s" repeatCount="indefinite"/></circle></svg>'

    ctaProjects:"شوف المشاريع", projectsTitle:"المشاريع", fAll:"الكل", fWeb:"مواقع ويب", fAndroid:"أندرويد",

  },

  }

let lang = "ar", filter = "all";
try { lang = localStorage.getItem("dw-lang") || "ar"; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrowIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';
const dlIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
  document.getElementById("langBtn").textContent = t.lang;



  const list = PROJECTS.filter(p => filter === "all" || p.platforms.includes(filter));
  document.getElementById("grid").innerHTML = list.map((p, i) => `
    <article class="card reveal" style="--d:${(i % 3) * 0.12}s">
      <div class="card-top">
        <div class="ic">${ICONS[p.id]}</div>
        <div><h3>${esc(p.name[lang])}</h3><div class="alt">${esc(lang === "ar" ? p.name.en : p.name.ar)}</div></div>
      </div>
      <p>${esc(p.desc[lang])}</p>
      <div class="tags">
        ${p.platforms.map(x => `<span class="tag">${t[x]}</span>`).join("")}
        <span class="status ${p.live ? "live" : ""}">${p.live ? t.live : t.dev}</span>
      </div>
      <div class="actions">
        ${p.url ? `<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">${t.try} ${arrowIcon}</a>` : ""}
        ${p.platforms.includes("android") ? (p.apk
          ? `<a class="btn" href="${esc(p.apk)}" target="_blank" rel="noopener">${dlIcon} ${t.apk}</a>`
          : `<span class="btn" aria-disabled="true">${dlIcon} ${t.apk} · ${t.soon}</span>`) : ""}
        <a class="btn" href="https://github.com/${esc(p.repo)}" target="_blank" rel="noopener">${t.code}</a>
      </div>
      <div class="repo">github.com/${esc(p.repo)}</div>
    </article>`).join("");

  const n = PROJECTS.length;
  const nAndroid = PROJECTS.filter(p => p.platforms.includes("android")).length;
  const nWeb = PROJECTS.filter(p => p.platforms.includes("web")).length;
  document.getElementById("facts").innerHTML =
    `<li><b data-count="${n}">${n}</b>${t.fProjects}</li><li><b data-count="${nAndroid}">${nAndroid}</b>${t.fAndroidApps}</li><li><b data-count="${nWeb}">${nWeb}</b>${t.fWebApps}</li>`;
}

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("dw-lang", lang); } catch (e) {}
  render();
});
document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
document.getElementById("year").textContent = new Date().getFullYear();
render();

/* ===== motion ===== */
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fine = matchMedia("(pointer: fine)").matches;

/* scroll reveal + count-up */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in"); io.unobserve(e.target);
  e.target.querySelectorAll("[data-count]").forEach(countUp);
}), { threshold: .15 }) : null;
function watch() {
  document.querySelectorAll(".reveal:not(.in)").forEach(el => io ? io.observe(el) : el.classList.add("in"));
  bindTilt();
}
function countUp(el) {
  const end = +el.dataset.count; if (calm || !end) return;
  const t0 = performance.now();
  (function step(t) { const k = Math.min(1, (t - t0) / 1200); el.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
}
const _render = render;
render = function () { _render(); document.querySelectorAll(".reveal").forEach(el => el.classList.add("in")); bindTilt(); };
watch();

/* header + progress */
const hdr = document.getElementById("hdr"), bar = document.getElementById("progress");
addEventListener("scroll", () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
  hdr.classList.toggle("small", scrollY > 40);
}, { passive: true });

/* 3D tilt */
function bindTilt() {
  if (calm || !fine) return;
  document.querySelectorAll(".card").forEach(c => {
    if (c._tilt) return; c._tilt = 1;
    c.addEventListener("pointermove", e => {
      const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      c.style.setProperty("--mx", x * 100 + "%"); c.style.setProperty("--my", y * 100 + "%");
      c.style.transform = `rotateX(${(.5 - y) * 9}deg) rotateY(${(x - .5) * 11}deg) translateY(-4px)`;
    });
    c.addEventListener("pointerleave", () => { c.style.transform = ""; });
  });
}

/* magnetic button */
if (!calm && fine) document.querySelectorAll(".magnet").forEach(b => {
  b.addEventListener("pointermove", e => { const r = b.getBoundingClientRect(); b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .25}px,${(e.clientY - r.top - r.height / 2) * .35}px)`; });
  b.addEventListener("pointerleave", () => { b.style.transform = ""; });
});

/* gold dust behind the logo, drifting up and leaning toward the cursor */
(function dust() {
  const cv = document.getElementById("dust"), ctx = cv.getContext("2d"); if (!ctx) return;
  let W, H, dpr, parts = [], mx = 0, my = 0;
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(110, W * H / 9000));
    parts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.7 + .3, v: Math.random() * .35 + .08, z: Math.random() * .8 + .2, p: Math.random() * 6.28 }));
  }
  size(); addEventListener("resize", size);
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });
  function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const q of parts) {
      if (!calm) { q.y -= q.v; q.x += Math.sin(t / 2000 + q.p) * .15; if (q.y < -5) { q.y = H + 5; q.x = Math.random() * W; } }
      const a = .25 + .55 * (0.5 + 0.5 * Math.sin(t / 700 + q.p));
      const x = q.x + mx * 40 * q.z, y = q.y + my * 30 * q.z;
      const g = ctx.createRadialGradient(x, y, 0, x, y, q.r * 4);
      g.addColorStop(0, `rgba(239,217,163,${a})`); g.addColorStop(1, "rgba(201,160,99,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, q.r * 4, 0, 6.283); ctx.fill();
    }
    if (!calm) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
